[project]
name = "doc-studio"
version = "1.0.0"
description = "100% Free, Zero-Signup, Portable Precision Document, Thesis (Skripsi), Q1 Paper, Zero-Overlap Draw.io Diagram, KBBI/Vale/Harper Prose QA, and Codebase-Synced Living Docs MCP & CLI Studio."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2",
    "python-docx>=1.1.0",
    "docxtpl>=0.18.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "pymupdf>=1.24.0",
    "pypdf>=4.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
doc-studio = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
